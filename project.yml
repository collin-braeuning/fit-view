name: FitView
options:
  bundleIdPrefix: com.fitview
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  FitViewCore:
    path: Packages/FitViewCore
# Tracked base config; it optionally `#include?`s the gitignored
# Secrets.xcconfig. Supplies POLAR_CLIENT_ID / POLAR_CLIENT_SECRET, which are
# substituted into each target's Info.plist. Both ship as placeholder text
# until a Polar client is registered; PolarConfiguration.isConfigured treats
# placeholders as "not configured" so the app degrades gracefully.
# Referencing Secrets.xcconfig here directly would break `xcodegen generate`
# on any clone that doesn't have it.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  FitView-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FitView
      - path: Sources/FitView-iOS
    dependencies:
      - package: FitViewCore
      - target: FitViewShareExtension-iOS
        embed: true
    settings:
      base:
        PRODUCT_NAME: FitView
        PRODUCT_BUNDLE_IDENTIFIER: com.fitview.app
        INFOPLIST_FILE: Sources/FitView-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4GP83563V4
    # App Sandbox + the shared App Group are new here — needed so the share
    # extension (always sandboxed) can read the folder bookmark this app
    # persists in Settings. See FolderBookmark/AppGroup in FitViewCore.
    entitlements:
      path: Sources/FitView-iOS/FitView.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.fitview.app
  FitView-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/FitView
      - path: Sources/FitView-macOS
    dependencies:
      - package: FitViewCore
      - target: FitViewShareExtension-macOS
        embed: true
    settings:
      base:
        PRODUCT_NAME: FitView
        PRODUCT_BUNDLE_IDENTIFIER: com.fitview.app.mac
        INFOPLIST_FILE: Sources/FitView-macOS/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
    # App Sandbox + the shared App Group are new here — needed so the share
    # extension (always sandboxed) can read the folder bookmark this app
    # persists in Settings. files.user-selected.read-write is what lets a
    # sandboxed process (either this app or the extension) resolve and start
    # access on a security-scoped bookmark at all on macOS.
    entitlements:
      path: Sources/FitView-macOS/FitView.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.fitview.app
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
  # Unit tests for Sources/FitView's SwiftUI-free helpers (currently just
  # BatchOverviewModel). Hosted by FitView-macOS via TEST_HOST/BUNDLE_LOADER —
  # the standard XcodeGen recipe for testing app-target code with
  # `@testable import` — rather than package: FitViewCore, since this is
  # presentation-mapping code, not domain logic; see specs/001-activity-list/research.md §1.
  FitViewTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/FitViewTests
      # Share Extension logic (ShareImportViewModel) is already SwiftUI-free
      # but otherwise compiles only into the extension targets below, so
      # nothing about it runs in CI — added here to close that gap; see
      # specs/003-import-flow/research.md §1.
      - path: Sources/ShareExtension/Shared
    dependencies:
      - target: FitView-macOS
      - package: FitViewCore
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitView.app/Contents/MacOS/FitView"
        GENERATE_INFOPLIST_FILE: YES
  FitViewShareExtension-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ShareExtension/Shared
      - path: Sources/ShareExtension/iOS
    dependencies:
      - package: FitViewCore
    settings:
      base:
        PRODUCT_NAME: FitViewShare
        PRODUCT_BUNDLE_IDENTIFIER: com.fitview.app.share
        INFOPLIST_FILE: Sources/ShareExtension/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4GP83563V4
    entitlements:
      path: Sources/ShareExtension/iOS/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.fitview.app
  FitViewShareExtension-macOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ShareExtension/Shared
      - path: Sources/ShareExtension/macOS
    dependencies:
      - package: FitViewCore
    settings:
      base:
        PRODUCT_NAME: FitViewShare
        PRODUCT_BUNDLE_IDENTIFIER: com.fitview.app.mac.share
        INFOPLIST_FILE: Sources/ShareExtension/macOS/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Sources/ShareExtension/macOS/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.fitview.app
        com.apple.security.files.user-selected.read-write: true
schemes:
  # Explicit, not autogenerated: FitViewTests is a hosted unit-test bundle
  # (TEST_HOST/BUNDLE_LOADER point at FitView-macOS), and XcodeGen's default
  # per-target scheme generation doesn't attach hosted test targets to their
  # host's scheme on its own — `xcodebuild test -scheme FitView-macOS
  # -only-testing:FitViewTests` needs this to exist.
  FitView-macOS:
    build:
      targets:
        FitView-macOS: all
        FitViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitViewTests
    archive:
      config: Release

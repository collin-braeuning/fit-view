name: FitView
options:
  bundleIdPrefix: com.fitview
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  FitViewCore:
    path: Packages/FitViewCore
# Untracked (see .gitignore) — populated from Secrets.xcconfig.template.
# Supplies POLAR_CLIENT_ID / POLAR_CLIENT_SECRET, substituted into each
# target's Info.plist. Both keys ship as placeholder text until a Polar
# client is registered; PolarConfiguration.isConfigured treats placeholders
# as "not configured" so the app degrades gracefully rather than crashing.
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  FitView-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FitView
      - path: Sources/FitView-iOS
    dependencies:
      - package: FitViewCore
    settings:
      base:
        PRODUCT_NAME: FitView
        PRODUCT_BUNDLE_IDENTIFIER: com.fitview.app
        INFOPLIST_FILE: Sources/FitView-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  FitView-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/FitView
      - path: Sources/FitView-macOS
    dependencies:
      - package: FitViewCore
    settings:
      base:
        PRODUCT_NAME: FitView
        PRODUCT_BUNDLE_IDENTIFIER: com.fitview.app.mac
        INFOPLIST_FILE: Sources/FitView-macOS/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
